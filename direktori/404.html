<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title id="seo-title">Memuat Detail Usaha... — Laundry Directory</title>
  <meta id="seo-desc" name="description" content="Lihat alamat lengkap, nomor WhatsApp, lokasi peta, dan layanan usaha kebersihan.">
  <link id="seo-canonical" rel="canonical" href="" />

  <meta property="og:type" content="business.business" />
  <meta property="og:site_name" content="Laundry Directory" />
  <meta id="og-title" property="og:title" content="Memuat Detail Usaha..." />
  <meta id="og-desc" property="og:description" content="Informasi detail layanan laundry dan kebersihan." />
  <meta id="og-url" property="og:url" content="" />
  <meta id="og-image" property="og:image" content="https://images.unsplash.com/photo-1545173168-9f1947eebb7f?w=1200&auto=format&fit=crop&q=80" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root { --header-bg: #1e3a8a; --header-text: #ffffff; --footer-bg: #f97316; --footer-text: #000000; --bg: #ffffff; --text: #000000; --border: #e5e7eb; --primary: #0284c7; }
    body.dark-mode { --header-bg: #0f172a; --footer-bg: #c2410c; --footer-text: #ffffff; --bg: #0f172a; --text: #f8fafc; --border: #334155; }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: var(--header-bg); color: var(--header-text); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 a { color: var(--header-text); text-decoration: none; font-size: 1.25rem; font-weight: 700; }
    
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; flex: 1; width: 100%; }
    .card { background: var(--bg); border: 1px solid var(--border); padding: 1.5rem; border-radius: 8px; display: flex; flex-direction: column; gap: 1rem; }
    .badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; width: fit-content; }
    
    .btn { padding: 0.8rem; border-radius: 6px; border: none; text-align: center; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .btn-success { background: #16a34a; color: white; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-dark { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }

    .ad-slot-container { width: 100%; max-width: 800px; margin: 0.8rem auto; padding: 0 1rem; }
    .ad-banner-link { display: block; width: 100%; border-radius: 8px; overflow: hidden; }
    .ad-banner-img { width: 100%; height: auto; max-height: 180px; object-fit: cover; display: block; }

    footer { background: var(--footer-bg); color: var(--footer-text); padding: 1.5rem 1rem; margin-top: auto; }
  </style>

  <script id="json-ld-schema" type="application/ld+json"></script>
</head>
<body>

  <header>
    <h1><a href="./" id="home-link">← Laundry Directory</a></h1>
    <div>
      <button class="btn btn-dark" id="dark-mode-toggle">🌙 Mode Gelap</button>
    </div>
  </header>

  <div id="ad-slot-detail-top" class="ad-slot-container"></div>

  <main class="container">
    <article class="card" id="content">
      <div style="text-align: center; padding: 2rem; color: #64748b;">Memuat informasi usaha...</div>
    </article>
  </main>

  <div id="ad-slot-detail-bottom" class="ad-slot-container"></div>

  <footer>
    <div style="text-align: center; font-size: 0.85rem;">
      &copy; <span id="current-year"></span> Laundry Directory. Hak Cipta Dilindungi.
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAY2JOM_GK_c8MIKOOROjG61XtC-VxF3Gc",
      authDomain: "laundry-directory-1915d.firebaseapp.com",
      projectId: "laundry-directory-1915d",
      storageBucket: "laundry-directory-1915d.appspot.com",
      messagingSenderId: "336437234560",
      appId: "1:336437234560:web:69dc7cbb36704c9f614f65"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function getBasePath() {
      const path = window.location.pathname;
      if (path.startsWith('/direktori')) return '/direktori';
      const segments = path.split('/').filter(Boolean);
      return window.location.hostname.includes('github.io') && segments.length > 0 ? '/' + segments[0] : '';
    }

    document.getElementById("current-year").innerText = new Date().getFullYear();

    const darkToggle = document.getElementById("dark-mode-toggle");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
      darkToggle.innerText = "☀️ Mode Terang";
    }
    darkToggle.onclick = () => {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      darkToggle.innerText = isDark ? "☀️ Mode Terang" : "🌙 Mode Gelap";
    };

    async function renderAds() {
      try {
        const snap = await getDocs(collection(db, "advertisements"));
        const ads = [];
        snap.forEach(d => ads.push({ id: d.id, ...d.data() }));

        const slotDetailTop = document.getElementById("ad-slot-detail-top");
        const slotDetailBottom = document.getElementById("ad-slot-detail-bottom");

        if (slotDetailTop) slotDetailTop.innerHTML = "";
        if (slotDetailBottom) slotDetailBottom.innerHTML = "";

        ads.forEach(ad => {
          if (!ad.imageUrl || !ad.linkUrl) return;
          const adHtml = `<a href="${ad.linkUrl}" target="_blank" class="ad-banner-link"><img src="${ad.imageUrl}" class="ad-banner-img" alt="Iklan Banner"></a>`;
          if (ad.placement === 'detail_top' && slotDetailTop) slotDetailTop.innerHTML = adHtml;
          if (ad.placement === 'detail_bottom' && slotDetailBottom) slotDetailBottom.innerHTML = adHtml;
        });
      } catch (err) { console.error("Ad render error:", err); }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      renderAds();

      const basePath = getBasePath();
      const homeLink = document.getElementById("home-link");
      if (homeLink) homeLink.href = `${basePath}/`;

      // BACA SEGMEN SLUG AKHIR DARI URL
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      let slug = pathSegments[pathSegments.length - 1];

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("slug")) {
        slug = urlParams.get("slug");
      }

      if (!slug || slug === 'index.html' || slug === '404.html' || slug === 'detail.html') {
        showError("URL tidak valid.");
        return;
      }

      try {
        const q = query(collection(db, "businesses"), where("slug", "==", slug));
        const snap = await getDocs(q);

        if (snap.empty) {
          showError(`Usaha "${slug}" tidak ditemukan atau belum disetujui Admin.`);
          return;
        }

        const businessData = snap.docs[0].data();
        renderDetail(businessData);
        injectSEOMetadata(businessData);
      } catch (err) {
        showError("Gagal mengambil data: " + err.message);
      }
    });

    function renderDetail(b) {
      let waNum = b.whatsapp ? b.whatsapp.replace(/[^0-9]/g, '') : '';
      if (waNum.startsWith('0')) waNum = '62' + waNum.slice(1);
      const waUrl = waNum ? `https://wa.me/${waNum}?text=${encodeURIComponent("Halo, saya menemukan usaha Anda via Laundry Directory.")}` : '#';
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${b.latitude},${b.longitude}`;

      const imgs = (b.images && b.images.length > 0) ? b.images : [b.imageUrl || 'https://images.unsplash.com/photo-1545173168-9f1947eebb7f?w=600'];
      const galleryHtml = `<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:0.5rem;">${imgs.map(img => `<img src="${img}" style="width:100%; height:160px; object-fit:cover; border-radius:6px;" alt="${b.name}">`).join('')}</div>`;

      document.getElementById("content").innerHTML = `
        ${galleryHtml}
        <span class="badge" style="margin-top:0.5rem;">${b.category}</span>
        <h1 style="color:var(--primary); font-size:1.5rem;">${b.name} ${b.city || ''}</h1>
        <p style="color:var(--text-muted);">${b.description || 'Layanan profesional, cepat, dan terpercaya.'}</p>
        <hr style="border:0; border-top:1px solid var(--border); margin:0.5rem 0;">
        <div style="font-size:0.9rem; display:flex; flex-direction:column; gap:6px;">
          <div><strong>📍 Alamat:</strong> ${b.address}, ${b.city}, ${b.province || ''}</div>
          <div><strong>🕒 Jam Operasional:</strong> ${b.openingHours || '08:00 - 20:00'}</div>
          <div><strong>💬 WhatsApp:</strong> ${b.whatsapp || '-'}</div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-top:1rem;">
          <a href="${waUrl}" target="_blank" class="btn btn-success" style="font-size:0.9rem;">💬 WhatsApp</a>
          <a href="${mapsUrl}" target="_blank" class="btn btn-primary" style="font-size:0.9rem;">🧭 Petunjuk Arah</a>
        </div>

        <h3 style="margin-top:1rem;">Lokasi Peta</h3>
        <div id="detail-map" style="height:280px; width:100%; border-radius:8px; border:1px solid var(--border); margin-top:0.5rem;"></div>
      `;

      if (b.latitude && b.longitude) {
        setTimeout(() => {
          const map = L.map('detail-map').setView([b.latitude, b.longitude], 15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
          L.marker([b.latitude, b.longitude]).addTo(map).bindPopup(`<b>${b.name}</b>`).openPopup();
          map.invalidateSize();
        }, 150);
      }
    }

    function injectSEOMetadata(b) {
      const currentUrl = window.location.href;
      const imgs = (b.images && b.images.length > 0) ? b.images : [b.imageUrl || 'https://images.unsplash.com/photo-1545173168-9f1947eebb7f?w=1200'];
      const thumbUrl = imgs[0];

      const pageTitle = `${b.name} ${b.city} — ${b.category} | Laundry Directory`;
      const pageDesc = `${b.name} di ${b.city}, ${b.province || ''} melayani ${b.category}. Alamat: ${b.address}. Hubungi WhatsApp dan lihat lokasi peta.`;

      document.title = pageTitle;
      document.getElementById("seo-title").innerText = pageTitle;
      document.getElementById("seo-desc").setAttribute("content", pageDesc);
      document.getElementById("seo-canonical").setAttribute("href", currentUrl);

      document.getElementById("og-title").setAttribute("content", pageTitle);
      document.getElementById("og-desc").setAttribute("content", pageDesc);
      document.getElementById("og-url").setAttribute("content", currentUrl);
      document.getElementById("og-image").setAttribute("content", thumbUrl);

      const schemaData = {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": b.name,
        "image": thumbUrl,
        "url": currentUrl,
        "telephone": b.whatsapp,
        "address": {
          "@type": "PostalAddress",
          "streetAddress": b.address,
          "addressLocality": b.city,
          "addressRegion": b.province || "Indonesia"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": b.latitude,
          "longitude": b.longitude
        }
      };

      document.getElementById("json-ld-schema").textContent = JSON.stringify(schemaData);
    }

    function showError(msg) {
      const basePath = getBasePath();
      document.getElementById("content").innerHTML = `
        <h2 style="color:#ef4444;">Usaha Tidak Ditemukan</h2>
        <p style="margin-top:0.5rem;">${msg}</p>
        <a href="${basePath}/" class="btn btn-primary" style="width:fit-content; margin-top:1rem;">← Kembali ke Utama</a>
      `;
    }
  </script>
</body>
</html>
