<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registrasi Owner — Laundry Directory V2.0</title>
  <meta name="description" content="Halaman login dan pendaftaran akun pengelola bisnis usaha laundry di Laundry Directory V2.0.">

  <!-- HUBUNGKAN DENGAN STYLE.CSS -->
  <link rel="stylesheet" href="./style.css" />
  <style>
    .auth-card { max-width: 420px; margin: 2rem auto; background: var(--surface); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); width: 90%; flex: 1; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 0.6rem; border: none; background: none; cursor: pointer; font-weight: 600; color: #64748b; }
    .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
    .captcha-box { background: rgba(0,0,0,0.03); padding: 0.6rem; border-radius: 6px; border: 1px dashed var(--border); margin-bottom: 0.8rem; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1><a href="./">Laundry Directory V2.0</a></h1>
    <div class="header-actions">
      <button class="btn btn-dark" id="dark-mode-toggle">🌙 Mode Gelap</button>
      <a href="./" class="btn btn-primary">← Ke Utama</a>
    </div>
  </header>

  <main class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login">Login</button>
      <button class="tab-btn" id="tab-register">Registrasi Owner</button>
    </div>

    <!-- FORM LOGIN -->
    <form id="login-form">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Masuk (Login)</button>
    </form>

    <!-- FORM REGISTRASI WITH CAPTCHA -->
    <form id="register-form" style="display: none;">
      <div class="form-group"><label>Nama Lengkap Owner</label><input type="text" id="reg-name" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="reg-email" required></div>
      <div class="form-group"><label>Nomor WhatsApp</label><input type="text" id="reg-phone" required placeholder="085712345678"></div>
      <div class="form-group"><label>Password</label><input type="password" id="reg-password" required minlength="6"></div>
      
      <div class="captcha-box">
        <label id="captcha-label" style="font-weight: bold; color: var(--primary);"></label>
        <input type="number" id="captcha-answer" placeholder="Jawaban angka" required style="margin-top:0.4rem; width:100%; padding:0.5rem;">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;">Daftar Akun Owner</button>
    </form>
  </main>

  <footer>
    <div class="footer-container">
      <div class="footer-links">
        <a href="./about.html">Tentang Kami</a>
        <a href="./contact.html">Kontak</a>
        <a href="./auth.html">Login / Registrasi</a>
      </div>
      <div class="copyright">
        &copy; <span id="current-year"></span> Laundry Directory V2.0. Hak Cipta Dilindungi.
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <!-- SCRIPT LOGIKA AUTHENTICATION BERSATU DENGAN SCRIPT.JS -->
  <script type="module">
    import { auth, db, showToast } from "./script.js";
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let num1 = 0, num2 = 0, captchaResult = 0;

    function generateCaptcha() {
      num1 = Math.floor(Math.random() * 10) + 1;
      num2 = Math.floor(Math.random() * 10) + 1;
      const isAddition = Math.random() > 0.5;

      if (isAddition) {
        captchaResult = num1 + num2;
        document.getElementById("captcha-label").innerText = `Verifikasi: ${num1} + ${num2} = ?`;
      } else {
        if (num1 < num2) [num1, num2] = [num2, num1];
        captchaResult = num1 - num2;
        document.getElementById("captcha-label").innerText = `Verifikasi: ${num1} - ${num2} = ?`;
      }
    }

    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const formLogin = document.getElementById("login-form");
    const formRegister = document.getElementById("register-form");

    tabLogin.onclick = () => { tabLogin.classList.add("active"); tabRegister.classList.remove("active"); formLogin.style.display = "block"; formRegister.style.display = "none"; };
    tabRegister.onclick = () => { tabRegister.classList.add("active"); tabLogin.classList.remove("active"); formRegister.style.display = "block"; formLogin.style.display = "none"; generateCaptcha(); };

    formLogin.onsubmit = async (e) => {
      e.preventDefault();
      try {
        const email = document.getElementById("login-email").value.trim();
        const pwd = document.getElementById("login-password").value;

        const cred = await signInWithEmailAndPassword(auth, email, pwd);
        const userDoc = await getDoc(doc(db, "users", cred.user.uid));

        let userData = userDoc.exists() ? userDoc.data() : null;
        if (!userData) {
          const isAdmin = cred.user.email === "bandardeterjen@gmail.com";
          userData = { uid: cred.user.uid, email: cred.user.email, name: isAdmin ? "Admin" : "Owner", role: isAdmin ? "admin" : "owner", status: "approved" };
          await setDoc(doc(db, "users", cred.user.uid), userData);
        }

        if (userData.role !== 'admin' && userData.status !== 'approved') {
          await signOut(auth);
          showToast("Akun Anda masih menunggu persetujuan Admin.", "warning");
          return;
        }

        showToast("Login Berhasil! Mengalihkan...", "success");
        setTimeout(() => { window.location.href = "./"; }, 1000);

      } catch (err) { showToast("Gagal Login: " + err.message, "error"); }
    };

    formRegister.onsubmit = async (e) => {
      e.preventDefault();
      if (parseInt(document.getElementById("captcha-answer").value) !== captchaResult) {
        showToast("Jawaban captcha salah!", "error"); generateCaptcha(); return;
      }

      try {
        const email = document.getElementById("reg-email").value.trim();
        const cred = await createUserWithEmailAndPassword(auth, email, document.getElementById("reg-password").value);

        await setDoc(doc(db, "users", cred.user.uid), {
          uid: cred.user.uid,
          name: document.getElementById("reg-name").value,
          email: email,
          phone: document.getElementById("reg-phone").value,
          role: "owner", status: "pending",
          createdAt: serverTimestamp()
        });

        await signOut(auth);
        showToast("Registrasi Berhasil! Menunggu approval Admin.", "success");
        setTimeout(() => { tabLogin.click(); }, 2000);

      } catch (err) { showToast("Gagal Registrasi: " + err.message, "error"); generateCaptcha(); }
    };

    generateCaptcha();
  </script>
</body>
</html>
