<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Laundry Directory — Cari Laundry, Cuci Sepatu & Cleaning Terdekat</title>
  <meta name="description" content="Temukan tempat laundry kiloan, cuci sepatu, home cleaning, cuci sofa, dan jasa kebersihan terdekat berbasis peta interaktif.">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --header-bg: #1e3a8a;
      --header-text: #ffffff;
      --footer-bg: #f97316;
      --footer-text: #000000;
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #000000;
      --text-muted: #4b5563;
      --border: #e5e7eb;
      --primary: #0284c7;
      --card-bg: #ffffff;
    }

    body.dark-mode {
      --header-bg: #0f172a;
      --header-text: #ffffff;
      --footer-bg: #c2410c;
      --footer-text: #ffffff;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #38bdf8;
      --card-bg: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; }

    header { background: var(--header-bg); color: var(--header-text); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 0.8rem; }
    header h1 a { color: var(--header-text); text-decoration: none; font-size: 1.25rem; font-weight: 700; }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

    .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: #0f172a; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-dark { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }

    #map { width: 100%; height: 380px; background: #cbd5e1; z-index: 1; }

    .container { max-width: 1000px; margin: 1rem auto; padding: 0 1rem; width: 100%; flex: 1; }
    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .controls input { flex: 1; min-width: 200px; padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .card { background: var(--card-bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; }
    .card-img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
    .card-title { color: var(--primary); font-weight: 700; text-decoration: none; font-size: 1.05rem; }
    .badge { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; width: fit-content; }

    .pagination { display: flex; justify-content: center; gap: 0.3rem; margin: 1.5rem 0; flex-wrap: wrap; }
    .page-btn { padding: 0.4rem 0.8rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 4px; cursor: pointer; }
    .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .ad-slot-container { width: 100%; max-width: 1000px; margin: 0.8rem auto; padding: 0 1rem; }
    .ad-banner-link { display: block; width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .ad-banner-img { width: 100%; height: auto; max-height: 180px; object-fit: cover; display: block; }

    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; padding: 1rem; }
    .modal.active { display: flex; }
    .modal-content { background: var(--surface); color: var(--text); border-radius: 8px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
    
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.8rem; }
    .form-group input, .form-group select { padding: 0.6rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); width: 100%; }

    .coord-container { display: flex; flex-direction: column; gap: 0.8rem; }
    @media (min-width: 640px) { .coord-container { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; } }

    #picker-map { width: 100%; height: 200px; border-radius: 6px; border: 1px solid var(--border); margin-top: 0.3rem; }

    footer { background: var(--footer-bg); color: var(--footer-text); padding: 1.5rem 1rem; margin-top: auto; border-top: 1px solid var(--border); }
    .footer-container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; align-items: center; text-align: center; }
    .footer-links { display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: center; }
    .footer-links a { color: var(--footer-text); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .copyright { font-size: 0.85rem; opacity: 0.9; }

    @media (min-width: 640px) { .footer-container { flex-direction: row; justify-content: space-between; text-align: left; } }

    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 0.8rem 1.5rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; z-index: 3000; display: none; text-align: center; max-width: 90%; }
    .toast.warning { background: #f59e0b; color: #000; }
    .toast.success { background: #16a34a; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1><a href="./">Laundry Directory</a></h1>
      <small style="opacity: 0.8;" id="user-status-text">Memuat status...</small>
    </div>
    <div class="header-actions">
      <button class="btn btn-dark" id="dark-mode-toggle">🌙 Mode Gelap</button>
      <div id="auth-buttons-wrapper">
        <a href="./auth.html" class="btn btn-primary">🔑 Login / Register</a>
      </div>
    </div>
  </header>

  <div id="ad-slot-main-top" class="ad-slot-container"></div>

  <div id="map"></div>

  <main class="container">
    <div class="controls">
      <input type="text" id="search" placeholder="Cari laundry, cuci sepatu, kota...">
      <button id="add-data-btn" class="btn btn-primary" style="display:none;">+ Tambah Usaha</button>
    </div>

    <div id="data-list" class="grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 2rem;">Memuat data usaha...</div>
    </div>

    <div class="pagination" id="pagination" style="display: none;">
      <button class="page-btn" id="p-first">&lt;&lt;</button>
      <button class="page-btn" id="p-prev">&lt;</button>
      <div id="p-numbers" style="display: flex; gap: 0.3rem;"></div>
      <button class="page-btn" id="p-next">&gt;</button>
      <button class="page-btn" id="p-last">&gt;&gt;</button>
    </div>
  </main>

  <div id="ad-slot-main-bottom" class="ad-slot-container"></div>

  <footer>
    <div class="footer-container">
      <div class="footer-links">
        <a href="./about.html">Tentang Kami</a>
        <a href="./contact.html">Kontak</a>
        <a href="./auth.html">Login / Registrasi</a>
      </div>
      <div class="copyright">
        &copy; <span id="current-year"></span> Laundry Directory. Hak Cipta Dilindungi.
      </div>
    </div>
  </footer>

  <div class="modal" id="add-modal">
    <div class="modal-content">
      <h2 style="color:var(--primary); margin-bottom:1rem;" id="modal-title">Tambah Usaha Baru</h2>
      <form id="add-form">
        <input type="hidden" id="f-id">
        <div class="form-group"><label>Nama Usaha</label><input type="text" id="f-name" required placeholder="Contoh: Bandar Laundry"></div>
        <div class="form-group"><label>Kategori</label>
          <select id="f-category" required>
            <option value="Laundry Kiloan">Laundry Kiloan</option>
            <option value="Laundry Satuan">Laundry Satuan</option>
            <option value="Cuci Sepatu">Cuci Sepatu</option>
            <option value="Cuci Sofa">Cuci Sofa</option>
            <option value="Home Cleaning">Home Cleaning</option>
            <option value="Car Wash">Car Wash</option>
          </select>
        </div>

        <div class="form-group"><label>Provinsi</label>
          <select id="f-province" required>
            <option value="">-- Pilih Provinsi --</option>
            <option value="Jawa Barat">Jawa Barat</option>
            <option value="DKI Jakarta">DKI Jakarta</option>
            <option value="Jawa Tengah">Jawa Tengah</option>
            <option value="Jawa Timur">Jawa Timur</option>
            <option value="Banten">Banten</option>
            <option value="Bali">Bali</option>
          </select>
        </div>

        <div class="form-group"><label>Kota / Kabupaten</label><input type="text" id="f-city" required placeholder="Ketik nama kota (misal: Bogor)"></div>
        <div class="form-group"><label>Alamat Jalan</label><input type="text" id="f-address" required placeholder="Jl. Raya No. 12"></div>

        <div class="form-group">
          <label>URL Gambar/Foto Usaha (Opsional, Maks 3 Image)</label>
          <div id="image-inputs-container" style="display:flex; flex-direction:column; gap:0.4rem;">
            <input type="url" class="f-img-input" placeholder="URL Gambar 1 (Utama/Thumbnail)">
          </div>
          <button type="button" class="btn btn-secondary" id="add-img-col-btn" style="margin-top:0.4rem; font-size:0.75rem; width:fit-content;">+ Tambah Kolom Gambar</button>
        </div>

        <div class="form-group">
          <label>Pilih Lokasi di Peta</label>
          <div id="picker-map"></div>
        </div>

        <div class="coord-container">
          <div class="form-group">
            <label>Latitude</label>
            <input type="number" step="any" id="f-lat" required readonly style="background:var(--border);">
          </div>
          <div class="form-group">
            <label>Longitude</label>
            <input type="number" step="any" id="f-lng" required readonly style="background:var(--border);">
          </div>
        </div>

        <div class="form-group"><label>WhatsApp</label><input type="text" id="f-wa" required placeholder="085712345678"></div>

        <div style="display:flex; gap:0.5rem; margin-top:1rem;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Simpan Data Usaha</button>
          <button type="button" class="btn btn-secondary" id="close-modal-btn">Batal</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAY2JOM_GK_c8MIKOOROjG61XtC-VxF3Gc",
      authDomain: "laundry-directory-1915d.firebaseapp.com",
      projectId: "laundry-directory-1915d",
      storageBucket: "laundry-directory-1915d.appspot.com",
      messagingSenderId: "336437234560",
      appId: "1:336437234560:web:69dc7cbb36704c9f614f65"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let mainMap, mainMarkersGroup, pickerMap, pickerMarker;
    let rawData = [], filteredData = [], galleryImages = [];
    let currentPage = 1;
    const PER_PAGE = 12;
    let currentUser = null, isAdminUser = false;

    const INDONESIA_BOUNDS = L.latLngBounds(L.latLng(-11.1, 95.0), L.latLng(6.2, 141.0));

    function createSlug(text) {
      return text ? text.toString().toLowerCase().trim().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '') : '';
    }

    function showToast(msg, type = "info") {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.innerText = msg;
      toast.className = `toast ${type}`;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3500);
    }

    document.getElementById("current-year").innerText = new Date().getFullYear();

    const darkToggle = document.getElementById("dark-mode-toggle");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
      darkToggle.innerText = "☀️ Mode Terang";
    }
    darkToggle.onclick = () => {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      darkToggle.innerText = isDark ? "☀️ Mode Terang" : "🌙 Mode Gelap";
    };

    async function renderAds() {
      try {
        const snap = await getDocs(collection(db, "advertisements"));
        const ads = [];
        snap.forEach(d => ads.push({ id: d.id, ...d.data() }));

        const slotMainTop = document.getElementById("ad-slot-main-top");
        const slotMainBottom = document.getElementById("ad-slot-main-bottom");

        if (slotMainTop) slotMainTop.innerHTML = "";
        if (slotMainBottom) slotMainBottom.innerHTML = "";

        ads.forEach(ad => {
          if (!ad.imageUrl || !ad.linkUrl) return;
          const adHtml = `<a href="${ad.linkUrl}" target="_blank" class="ad-banner-link"><img src="${ad.imageUrl}" class="ad-banner-img" alt="Iklan Banner"></a>`;
          if (ad.placement === 'main_top' && slotMainTop) slotMainTop.innerHTML = adHtml;
          if (ad.placement === 'main_bottom' && slotMainBottom) slotMainBottom.innerHTML = adHtml;
        });
      } catch (err) { console.error("Ad render error:", err); }
    }

    const imgContainer = document.getElementById("image-inputs-container");
    const addImgBtn = document.getElementById("add-img-col-btn");

    addImgBtn.onclick = () => {
      const currentInputs = imgContainer.querySelectorAll(".f-img-input");
      if (currentInputs.length < 3) {
        const newInput = document.createElement("input");
        newInput.type = "url";
        newInput.className = "f-img-input";
        newInput.placeholder = `URL Gambar ${currentInputs.length + 1}`;
        imgContainer.appendChild(newInput);
        if (imgContainer.querySelectorAll(".f-img-input").length >= 3) addImgBtn.style.display = "none";
      }
    };

    function resetImageInputs(urls = []) {
      imgContainer.innerHTML = "";
      addImgBtn.style.display = "inline-block";
      const count = Math.max(1, urls.length);
      for (let i = 0; i < count; i++) {
        if (i >= 3) break;
        const input = document.createElement("input");
        input.type = "url";
        input.className = "f-img-input";
        input.placeholder = `URL Gambar ${i + 1}`;
        input.value = urls[i] || "";
        imgContainer.appendChild(input);
      }
      if (imgContainer.querySelectorAll(".f-img-input").length >= 3) addImgBtn.style.display = "none";
    }

    function initMainMap() {
      if (mainMap) mainMap.remove();
      mainMap = L.map('map', { maxBounds: INDONESIA_BOUNDS, maxBoundsViscosity: 1.0, minZoom: 5 }).setView([-2.5489, 118.0149], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mainMap);
      mainMarkersGroup = L.layerGroup().addTo(mainMap);
      setTimeout(() => { if (mainMap) mainMap.invalidateSize(); }, 300);
    }

    function initPickerMap() {
      if (pickerMap) return;
      pickerMap = L.map('picker-map', { maxBounds: INDONESIA_BOUNDS, maxBoundsViscosity: 1.0, minZoom: 5 }).setView([-6.4025, 106.9680], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(pickerMap);
      pickerMap.on('click', (e) => {
        if (INDONESIA_BOUNDS.contains(e.latlng)) setPickerLocation(e.latlng.lat, e.latlng.lng);
      });
    }

    function setPickerLocation(lat, lng) {
      document.getElementById("f-lat").value = lat.toFixed(6);
      document.getElementById("f-lng").value = lng.toFixed(6);
      if (pickerMarker) pickerMarker.setLatLng([lat, lng]);
      else pickerMarker = L.marker([lat, lng]).addTo(pickerMap);
    }

    async function loadData() {
      try {
        try {
          const gSnap = await getDocs(collection(db, "adminGallery"));
          galleryImages = [];
          gSnap.forEach(d => galleryImages.push(d.data().url));
        } catch (gErr) {}

        let snap = await getDocs(query(collection(db, "businesses"), where("status", "==", "active")));
        rawData = [];
        snap.forEach(d => rawData.push({ id: d.id, ...d.data() }));

        if (rawData.length === 0) {
          const allSnap = await getDocs(collection(db, "businesses"));
          rawData = [];
          allSnap.forEach(d => rawData.push({ id: d.id, ...d.data() }));
        }

        applyFilter();
      } catch (err) {
        document.getElementById("data-list").innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#ef4444; padding:2rem;">Gagal memuat data: ${err.message}</div>`;
      }
    }

    function applyFilter() {
      const kw = document.getElementById("search").value.toLowerCase().trim();
      filteredData = rawData.filter(d => `${d.name} ${d.category} ${d.city} ${d.province || ''} ${d.address}`.toLowerCase().includes(kw));
      currentPage = 1;
      updateMapMarkers();
      renderList();
    }

    function updateMapMarkers() {
      if (!mainMarkersGroup) return;
      mainMarkersGroup.clearLayers();
      const bounds = [];

      filteredData.forEach(d => {
        if (d.latitude && d.longitude) {
          bounds.push([d.latitude, d.longitude]);
          
          // FORMAT QUERY STRING (DIJAMIN TIDAK AKAN 404 DI SUBFOLDER)
          const targetSlug = d.slug || createSlug(d.name);
          const detailUrl = `./detail.html?slug=${targetSlug}`;

          const m = L.marker([d.latitude, d.longitude]);
          m.bindPopup(`<b>${d.name}</b><br>${d.category}<br>📍 ${d.city}<br><a href="${detailUrl}">Buka Detail</a>`);
          mainMarkersGroup.addLayer(m);
        }
      });

      if (bounds.length > 0 && mainMap) mainMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
    }

    function renderList() {
      const listEl = document.getElementById("data-list");
      listEl.innerHTML = "";

      if (filteredData.length === 0) {
        listEl.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem;">Belum ada data usaha terdaftar.</div>`;
        document.getElementById("pagination").style.display = "none";
        return;
      }

      const totalPages = Math.ceil(filteredData.length / PER_PAGE);
      const start = (currentPage - 1) * PER_PAGE;
      const pageItems = filteredData.slice(start, start + PER_PAGE);

      pageItems.forEach(d => {
        // FORMAT QUERY STRING (DIJAMIN TIDAK AKAN 404 DI SUBFOLDER)
        const targetSlug = d.slug || createSlug(d.name);
        const detailUrl = `./detail.html?slug=${targetSlug}`;

        const canEdit = currentUser && (isAdminUser || (d.ownerId && d.ownerId === currentUser.uid));
        const defaultRandom = galleryImages.length > 0 ? galleryImages[Math.floor(Math.random() * galleryImages.length)] : "https://images.unsplash.com/photo-1545173168-9f1947eebb7f?w=600";
        const displayThumb = (d.images && d.images.length > 0 && d.images[0]) ? d.images[0] : (d.imageUrl || defaultRandom);

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${displayThumb}" class="card-img" alt="${d.name}">
          <span class="badge">${d.category}</span>
          <a href="${detailUrl}" class="card-title">${d.name}</a>
          <small style="color:var(--text-muted);">📍 ${d.address}, ${d.city}</small>
          <div style="display:flex; gap:0.4rem; margin-top:0.3rem;">
            <a href="${detailUrl}" class="btn btn-secondary" style="font-size:0.75rem; flex:1; text-align:center;">Buka Detail →</a>
            ${canEdit ? `<button class="btn btn-primary" style="font-size:0.75rem;" id="edit-b-${d.id}">Edit</button>` : ''}
          </div>
        `;
        listEl.appendChild(card);

        if (canEdit) {
          setTimeout(() => {
            const btn = document.getElementById(`edit-b-${d.id}`);
            if (btn) btn.onclick = () => openModalForEdit(d);
          }, 0);
        }
      });

      renderPaginationControls(totalPages);
    }

    function renderPaginationControls(totalPages) {
      const pContainer = document.getElementById("pagination");
      const numbersEl = document.getElementById("p-numbers");

      if (totalPages <= 1) { pContainer.style.display = "none"; return; }
      pContainer.style.display = "flex";
      numbersEl.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.innerText = i;
        btn.onclick = () => { currentPage = i; renderList(); };
        numbersEl.appendChild(btn);
      }

      document.getElementById("p-first").disabled = currentPage === 1;
      document.getElementById("p-prev").disabled = currentPage === 1;
      document.getElementById("p-next").disabled = currentPage === totalPages;
      document.getElementById("p-last").disabled = currentPage === totalPages;

      document.getElementById("p-first").onclick = () => { currentPage = 1; renderList(); };
      document.getElementById("p-prev").onclick = () => { if (currentPage > 1) { currentPage--; renderList(); } };
      document.getElementById("p-next").onclick = () => { if (currentPage < totalPages) { currentPage++; renderList(); } };
      document.getElementById("p-last").onclick = () => { currentPage = totalPages; renderList(); };
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const statusText = document.getElementById("user-status-text");
      const authWrapper = document.getElementById("auth-buttons-wrapper");
      const addBtn = document.getElementById("add-data-btn");

      if (user) {
        statusText.innerText = `Logged in: ${user.email}`;
        isAdminUser = (user.email === 'bandardeterjen@gmail.com');

        authWrapper.innerHTML = `
          ${isAdminUser ? `<a href="./admin.html" class="btn btn-primary">Dashboard Admin</a>` : ''}
          <button class="btn btn-danger" id="logout-btn">Logout</button>
        `;
        addBtn.style.display = "inline-block";

        document.getElementById("logout-btn").onclick = async () => {
          await signOut(auth);
          currentUser = null;
          isAdminUser = false;
          renderList();
        };
      } else {
        currentUser = null;
        isAdminUser = false;
        statusText.innerText = `Peta & Katalog Usaha`;
        authWrapper.innerHTML = `<a href="./auth.html" class="btn btn-primary">🔑 Login / Register</a>`;
        addBtn.style.display = "none";
      }

      renderList();
    });

    function openModalForEdit(d) {
      document.getElementById("modal-title").innerText = isAdminUser ? `Edit Usaha: ${d.name} (Admin)` : "Edit Usaha Milik Anda";
      document.getElementById("f-id").value = d.id;
      document.getElementById("f-name").value = d.name;
      document.getElementById("f-category").value = d.category;
      document.getElementById("f-province").value = d.province || '';
      document.getElementById("f-city").value = d.city;
      document.getElementById("f-address").value = d.address;
      document.getElementById("f-wa").value = d.whatsapp;

      resetImageInputs(d.images || (d.imageUrl ? [d.imageUrl] : []));

      document.getElementById("add-modal").classList.add("active");
      setTimeout(() => { initPickerMap(); setPickerLocation(d.latitude, d.longitude); pickerMap.invalidateSize(); }, 200);
    }

    document.getElementById("add-data-btn").onclick = async () => {
      if (!currentUser) return;

      if (!isAdminUser) {
        const qUserBusinesses = query(collection(db, "businesses"), where("ownerId", "==", currentUser.uid));
        const userSnap = await getDocs(qUserBusinesses);

        if (!userSnap.empty) {
          showToast("⚠️ Anda sudah menambahkan 1 listing usaha.", "warning");
          return;
        }
      }

      document.getElementById("modal-title").innerText = "Tambah Usaha Baru (Pending Approved)";
      document.getElementById("add-form").reset();
      document.getElementById("f-id").value = "";
      resetImageInputs([]);
      document.getElementById("add-modal").classList.add("active");
      setTimeout(() => { initPickerMap(); if (pickerMap) pickerMap.invalidateSize(); }, 200);
    };

    document.getElementById("close-modal-btn").onclick = () => document.getElementById("add-modal").classList.remove("active");

    document.getElementById("add-form").onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById("f-id").value;
      const name = document.getElementById("f-name").value;

      const userInputs = imgContainer.querySelectorAll(".f-img-input");
      let userImages = [];
      userInputs.forEach(input => {
        if (input.value.trim()) userImages.push(input.value.trim());
      });

      if (userImages.length === 0) {
        const randomFallback = galleryImages.length > 0 ? galleryImages[Math.floor(Math.random() * galleryImages.length)] : "https://images.unsplash.com/photo-1545173168-9f1947eebb7f?w=600";
        userImages.push(randomFallback);
      }

      const payload = {
        name,
        slug: createSlug(name),
        category: document.getElementById("f-category").value,
        province: document.getElementById("f-province").value,
        city: document.getElementById("f-city").value,
        address: document.getElementById("f-address").value,
        images: userImages,
        imageUrl: userImages[0],
        latitude: parseFloat(document.getElementById("f-lat").value),
        longitude: parseFloat(document.getElementById("f-lng").value),
        whatsapp: document.getElementById("f-wa").value
      };

      try {
        if (id) {
          await updateDoc(doc(db, "businesses", id), payload);
          showToast("Data usaha berhasil diperbarui!", "success");
        } else {
          payload.ownerId = currentUser.uid;
          payload.status = isAdminUser ? "active" : "pending";
          payload.createdAt = serverTimestamp();
          await addDoc(collection(db, "businesses"), payload);
          showToast(isAdminUser ? "Usaha berhasil ditambahkan!" : "Usaha berhasil diajukan!", "success");
        }

        document.getElementById("add-modal").classList.remove("active");
        loadData();
      } catch (err) { showToast("Error: " + err.message, "error"); }
    };

    document.addEventListener("DOMContentLoaded", () => {
      initMainMap();
      renderAds();
      loadData();
      document.getElementById("search").addEventListener("input", applyFilter);
    });
  </script>
</body>
</html>
